<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Dashboard - TRISAK</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
(async () => {
  const me = await renderLayout('Dashboard');
  if (!me) return;
  const content = document.getElementById('content');
  content.innerHTML = `<p class="muted">กำลังโหลดข้อมูล...</p>`;

  const { stats, latest, upcoming } = await api.get('/api/dashboard/stats');
  const scopeLabel = me.role === 'Employee' ? 'คำขอทั้งหมดของฉัน' : 'คำขอทั้งหมดในระบบ';

  content.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card blue">
        <div class="label">${scopeLabel}</div>
        <div class="value">${stats.total}<span class="unit">คำขอ</span></div>
        <a class="more" href="/my-requests.html">ดูทั้งหมด &rarr;</a>
      </div>
      <div class="stat-card green">
        <div class="label">อนุมัติแล้ว</div>
        <div class="value">${stats.approved}<span class="unit">คำขอ</span></div>
        <a class="more" href="/my-requests.html">ดูทั้งหมด &rarr;</a>
      </div>
      <div class="stat-card orange">
        <div class="label">รออนุมัติ</div>
        <div class="value">${stats.pending}<span class="unit">คำขอ</span></div>
        <a class="more" href="${me.role === 'Employee' ? '/my-requests.html' : '/approve-requests.html'}">ดูทั้งหมด &rarr;</a>
      </div>
      <div class="stat-card red">
        <div class="label">ไม่อนุมัติ</div>
        <div class="value">${stats.rejected}<span class="unit">คำขอ</span></div>
        <a class="more" href="/my-requests.html">ดูทั้งหมด &rarr;</a>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-head">
          <h3>คำขอล่าสุด</h3>
          <a href="/my-requests.html">ดูทั้งหมด &rarr;</a>
        </div>
        <div class="card-body" style="padding:0;">
          <table>
            <thead><tr><th>วันที่</th><th>ลูกค้า/บริษัท</th><th>เวลา</th><th>สถานะ</th></tr></thead>
            <tbody id="latestBody"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>กำหนดการที่จะถึง</h3></div>
        <div class="card-body" id="upcomingBody"></div>
      </div>
    </div>
  `;

  const latestBody = document.getElementById('latestBody');
  latestBody.innerHTML = latest.length ? latest.map(v => `
    <tr>
      <td>${fmtDate(v.visit_date)}</td>
      <td>${v.customer_name}</td>
      <td>${v.time_from} - ${v.time_to}</td>
      <td><span class="badge ${v.status}">${statusLabel(v.status)}</span></td>
    </tr>
  `).join('') : `<tr><td colspan="4" class="empty">ยังไม่มีคำขอ</td></tr>`;

  const upcomingBody = document.getElementById('upcomingBody');
  upcomingBody.innerHTML = upcoming.length ? upcoming.map(v => `
    <div class="flex gap-12" style="padding:8px 0;border-bottom:1px solid var(--border);">
      <div class="pill-avatar">${fmtDate(v.visit_date).slice(0,2)}</div>
      <div>
        <div style="font-weight:600;">${v.customer_name}</div>
        <div class="muted" style="font-size:12px;">${fmtDate(v.visit_date)} · ${v.time_from} - ${v.time_to}</div>
      </div>
    </div>
  `).join('') : `<div class="empty">ยังไม่มีกำหนดการ</div>`;
})();
</script>
</body>
</html>
