<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>โปรไฟล์ - TRISAK</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
(async () => {
  const me = await renderLayout('โปรไฟล์');
  if (!me) return;
  const roleLabelMap = { Employee: 'พนักงาน', Approver: 'ผู้อนุมัติ', Admin: 'ผู้ดูแลระบบ' };

  document.getElementById('content').innerHTML = `
    <div class="grid-2">
      <div class="card">
        <div class="card-head"><h3>ข้อมูลส่วนตัว</h3></div>
        <div class="card-body">
          <div class="flex gap-12 mb-16">
            <div class="pill-avatar" style="width:64px;height:64px;font-size:20px;">${initials(me.full_name)}</div>
            <div>
              <div style="font-weight:700;font-size:15px;">${me.full_name}</div>
              <div class="muted">${me.position || '-'} · ${roleLabelMap[me.role]}</div>
            </div>
          </div>
          <form id="profileForm">
            <div class="form-group"><label>ชื่อ-นามสกุล</label><input id="f_name" value="${me.full_name}"></div>
            <div class="form-group"><label>อีเมล</label><input id="f_email" value="${me.email || ''}"></div>
            <div class="form-group"><label>เบอร์โทร</label><input id="f_phone" value="${me.phone || ''}"></div>
            <div class="form-group"><label>ตำแหน่ง</label><input id="f_position" value="${me.position || ''}"></div>
            <div class="form-group"><label>แผนก</label><input id="f_department" value="${me.department || ''}"></div>
            <div class="form-group">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                <input type="checkbox" id="f_email_notify" ${me.email_notify ? 'checked' : ''} style="width:16px;height:16px;">
                รับการแจ้งเตือนทางอีเมล (คำขอใหม่ / ผลการอนุมัติ)
              </label>
            </div>
            <div class="form-actions"><button type="submit" class="btn btn-primary">บันทึก</button></div>
          </form>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>เปลี่ยนรหัสผ่าน</h3></div>
        <div class="card-body">
          <form id="pwForm">
            <div class="form-group"><label>รหัสผ่านปัจจุบัน</label><input type="password" id="cur_pw" required></div>
            <div class="form-group"><label>รหัสผ่านใหม่</label><input type="password" id="new_pw" required></div>
            <div class="form-actions"><button type="submit" class="btn btn-primary">เปลี่ยนรหัสผ่าน</button></div>
          </form>
        </div>
      </div>
    </div>
  `;

  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await api.put('/api/users/me', {
        full_name: document.getElementById('f_name').value,
        email: document.getElementById('f_email').value,
        phone: document.getElementById('f_phone').value,
        position: document.getElementById('f_position').value,
        department: document.getElementById('f_department').value,
        email_notify: document.getElementById('f_email_notify').checked
      });
      toast('บันทึกข้อมูลสำเร็จ', 'success');
    } catch (err) { toast(err.message, 'error'); }
  });

  document.getElementById('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await api.put('/api/users/me/password', {
        current_password: document.getElementById('cur_pw').value,
        new_password: document.getElementById('new_pw').value
      });
      toast('เปลี่ยนรหัสผ่านสำเร็จ', 'success');
      e.target.reset();
    } catch (err) { toast(err.message, 'error'); }
  });
})();
</script>
</body>
</html>
